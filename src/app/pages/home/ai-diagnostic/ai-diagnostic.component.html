<div class="chess-card ai-diagnostic-widget overflow-hidden p-0 border-green-faint">
  
  <!-- Header -->
  <div class="diagnostic-header p-3 border-bottom border-dark d-flex justify-content-between align-items-center">
    <div class="d-flex align-items-center">
      <i class="fa-brands fa-linux text-green me-2 h5 mb-0"></i>
      <span class="smallest text-muted text-uppercase fw-bold" style="letter-spacing: 1px;">New to Linux? Start Here</span>
    </div>
    <div class="pulse-indicator">
      <span class="smallest text-green fw-bold">100% Free OS</span>
    </div>
  </div>

  <!-- Content Area -->
  <div class="diagnostic-body p-4">
    <h3 class="h6 fw-bold text-white mb-4">Top 4 Linux Distros for Beginners</h3>
    
    <div class="options-grid row g-2">
      <div class="col-6 col-md-3" *ngFor="let distro of distros">
        <a [href]="distro.link" target="_blank" rel="noopener noreferrer"
           class="chess-card hoverable w-100 p-3 text-center border-dark bg-transparent d-block text-decoration-none h-100">
          <i [class]="distro.icon + ' text-green h3 mb-2 d-block'"></i>
          <span class="small fw-bold text-white d-block mb-1">{{ distro.name }}</span>
          <span class="smallest text-muted d-block">{{ distro.subtitle }}</span>
        </a>
      </div>
    </div>

    <!-- DistroWatch Callout -->
    <div class="mt-4 pt-3 border-top border-dark d-flex flex-wrap justify-content-between align-items-center gap-2">
      <span class="smallest text-muted">
        Curious to explore more? Compare hundreds of Linux versions, rankings, and reviews on
        <a href="https://distrowatch.com/" target="_blank" rel="noopener noreferrer" class="text-green fw-bold text-decoration-none">DistroWatch.com</a>.
      </span>
      <a href="https://distrowatch.com/" target="_blank" rel="noopener noreferrer"
         class="smallest text-green fw-bold text-decoration-none">
        Visit DistroWatch <i class="fa-solid fa-arrow-up-right-from-square ms-1"></i>
      </a>
    </div>
  </div>

  <!-- Footer Stats -->
  <div class="diagnostic-footer px-3 py-2 border-top border-dark d-flex justify-content-between">
    <div class="smallest text-muted">
       <span class="text-green me-1">●</span> Breathe new life into your existing PC
    </div>
    <div class="smallest text-muted">
       No Forced Upgrades
    </div>
  </div>
</div>
