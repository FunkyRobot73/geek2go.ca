<div class="dashboard-grid animate__animated animate__fadeIn">
  <!-- MAIN CHANNEL (70%) -->
  <div class="main-channel">
    
    <header class="section-header mb-4 d-flex justify-content-between align-items-end">
      <div>
        <h1 class="h2 mb-0 text-white">Social Gallery</h1>
        <p class="text-muted smallest mb-0">Community Snapshots & Moments</p>
      </div>
    </header>

    <div *ngIf="loading" class="text-center py-5">
      <div class="spinner-border text-green" role="status">
         <span class="visually-hidden">Syncing...</span>
      </div>
    </div>

    <div *ngIf="!loading" class="chess-grid photo-grid">
      <div class="photo-item chess-card p-1" 
           *ngFor="let image of galleryImages; let i = index"
           (click)="openLightbox(image)">
        <div class="image-inner">
          <img [src]="image.thumbSrc || image.src" [alt]="image.alt">
          <div class="photo-overlay">
            <i class="fa-solid fa-magnifying-glass-plus text-green"></i>
          </div>
        </div>
      </div>
    </div>

    <!-- Load More Pagination -->
    <div class="text-center my-4" *ngIf="hasMorePhotos()">
      <button type="button" class="btn btn-outline-light rounded-pill px-4 py-2 smallest fw-bold" (click)="loadMore()">
        <i class="fa-solid fa-circle-chevron-down me-2 text-green"></i> Load More Photos ({{ remainingPhotosCount() }} remaining)
      </button>
    </div>

    <!-- Lightbox Modal (Chess Themed) -->
    <div class="lightbox-overlay" *ngIf="showLightbox" (click)="closeLightbox()">
      <div class="lightbox-content-chess" (click)="$event.stopPropagation()">
        <button class="lightbox-btn close-btn" (click)="closeLightbox()">&times;</button>
        
        <div class="img-container">
          <img [src]="selectedImage?.src" [alt]="selectedImage?.alt" class="lightbox-img-chess">
          <button class="lightbox-btn nav-btn prev" (click)="navigateLightbox(-1)">‹</button>
          <button class="lightbox-btn nav-btn next" (click)="navigateLightbox(1)">›</button>
        </div>
        
        <div class="lightbox-meta text-center mt-3">
          <p class="smallest text-white mb-0">{{selectedImage?.alt}}</p>
        </div>
      </div>
    </div>
  </div>

  <!-- SIDE CHANNEL (30%) -->
  <div class="side-channel">
    
    <!-- Archive Metadata -->
    <div class="chess-card mb-4 border-green-faint">
      <h3 class="smallest text-muted text-uppercase mb-3 font-weight-bold">Gallery Info</h3>
      <div class="d-flex justify-content-between smallest mb-2">
        <span class="text-muted">Type:</span>
        <span class="text-white">Social Photos</span>
      </div>
      <div class="d-flex justify-content-between smallest mb-2">
        <span class="text-muted">Source:</span>
        <span class="text-white">Social Captures</span>
      </div>
      <div class="d-flex justify-content-between smallest">
        <span class="text-muted">Status:</span>
        <span class="text-green fw-bold">Active</span>
      </div>
    </div>

    <div class="chess-card mb-4 border-dark">
        <h3 class="smallest text-muted text-uppercase mb-2 fw-bold">About This Gallery</h3>
        <p class="smallest text-white mb-0" style="opacity: 0.75;">
          Snapshots from Geek2Go's social side — events, customers, and community moments captured in the field.
        </p>
    </div>

  </div>
</div>
